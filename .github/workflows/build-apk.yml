name: Build SUIVI-TRX APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/dz/cosider/suivitrx
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SUIVI-TRX"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "dz.cosider.suivitrx"
              compileSdk = 35

              defaultConfig {
                  applicationId = "dz.cosider.suivitrx"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">SUIVI-TRX</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.SuiviTrx" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/Theme.SuiviTrx"
                  android:label="SUIVI-TRX"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/dz/cosider/suivitrx/MainActivity.kt <<'EOF'
          package dz.cosider.suivitrx

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val Green = Color(0xFF087F5B)
          private val Dark = Color(0xFF17211F)
          private val Background = Color(0xFFF6F7F4)

          data class Chantier(
              val code: String,
              val name: String,
              val location: String,
              val progress: Int
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      MaterialTheme(
                          colorScheme = lightColorScheme(
                              primary = Green,
                              background = Background
                          )
                      ) {
                          App()
                      }
                  }
              }
          }

          @Composable
          fun App() {
              var loggedIn by remember { mutableStateOf(false) }

              if (!loggedIn) {
                  LoginScreen {
                      loggedIn = true
                  }
              } else {
                  Dashboard {
                      loggedIn = false
                  }
              }
          }

          @Composable
          fun LoginScreen(onLogin: () -> Unit) {
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Background)
                      .padding(24.dp),
                  contentAlignment = Alignment.Center
              ) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(28.dp)
                  ) {
                      Column(
                          modifier = Modifier.padding(24.dp),
                          verticalArrangement = Arrangement.spacedBy(16.dp)
                      ) {
                          Text(
                              "COSIDER AGRICO",
                              color = Green,
                              fontWeight = FontWeight.Bold,
                              fontSize = 18.sp
                          )

                          Text(
                              "SUIVI-TRX",
                              color = Dark,
                              fontWeight = FontWeight.ExtraBold,
                              fontSize = 34.sp
                          )

                          Text(
                              "Suivi des travaux & contrats",
                              color = Color.Gray
                          )

                          OutlinedTextField(
                              value = email,
                              onValueChange = { email = it },
                              modifier = Modifier.fillMaxWidth(),
                              label = { Text("Email") },
                              singleLine = true
                          )

                          OutlinedTextField(
                              value = password,
                              onValueChange = { password = it },
                              modifier = Modifier.fillMaxWidth(),
                              label = { Text("Mot de passe") },
                              singleLine = true
                          )

                          Button(
                              onClick = onLogin,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(54.dp),
                              shape = RoundedCornerShape(16.dp)
                          ) {
                              Text("Se connecter")
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun Dashboard(onLogout: () -> Unit) {
              val chantiers = listOf(
                  Chantier("CTR-001", "Travaux routiers", "Adrar", 72),
                  Chantier("CTR-002", "Ouvrage hydraulique", "Alger", 48),
                  Chantier("CTR-003", "Aménagement VRD", "Tizi Ouzou", 91)
              )

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Column {
                                  Text(
                                      "SUIVI-TRX",
                                      fontWeight = FontWeight.ExtraBold
                                  )
                                  Text(
                                      "COSIDER AGRICO • UEV",
                                      fontSize = 11.sp,
                                      color = Color.Gray
                                  )
                              }
                          },
                          actions = {
                              IconButton(onClick = onLogout) {
                                  Icon(Icons.Default.Logout, "Déconnexion")
                              }
                          }
                      )
                  },
                  bottomBar = {
                      NavigationBar {
                          NavigationBarItem(
                              selected = true,
                              onClick = {},
                              icon = { Icon(Icons.Default.Home, null) },
                              label = { Text("Accueil") }
                          )
                          NavigationBarItem(
                              selected = false,
                              onClick = {},
                              icon = { Icon(Icons.Default.Build, null) },
                              label = { Text("Chantiers") }
                          )
                          NavigationBarItem(
                              selected = false,
                              onClick = {},
                              icon = { Icon(Icons.Default.Description, null) },
                              label = { Text("Rapports") }
                          )
                          NavigationBarItem(
                              selected = false,
                              onClick = {},
                              icon = { Icon(Icons.Default.Person, null) },
                              label = { Text("Profil") }
                          )
                      }
                  }
              ) { padding ->

                  LazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .padding(16.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {

                      item {
                          Text(
                              "Bonjour 👋",
                              color = Color.Gray
                          )

                          Text(
                              "Tableau de bord",
                              fontSize = 28.sp,
                              fontWeight = FontWeight.ExtraBold
                          )
                      }

                      item {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              StatCard(
                                  "Chantiers",
                                  "12",
                                  Modifier.weight(1f)
                              )

                              StatCard(
                                  "En cours",
                                  "8",
                                  Modifier.weight(1f)
                              )
                          }
                      }

                      item {
                          Text(
                              "Mes chantiers",
                              fontSize = 20.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }

                      items(chantiers) { chantier ->
                          ChantierCard(chantier)
                      }
                  }
              }
          }

          @Composable
          fun StatCard(
              title: String,
              value: String,
              modifier: Modifier
          ) {
              Card(
                  modifier = modifier,
                  shape = RoundedCornerShape(20.dp)
              ) {
                  Column(
                      modifier = Modifier.padding(16.dp)
                  ) {
                      Text(
                          value,
                          fontSize = 28.sp,
                          fontWeight = FontWeight.ExtraBold,
                          color = Green
                      )

                      Text(
                          title,
                          color = Color.Gray
                      )
                  }
              }
          }

          @Composable
          fun ChantierCard(chantier: Chantier) {
              Card(
                  modifier = Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(20.dp)
              ) {
                  Column(
                      modifier = Modifier.padding(18.dp)
                  ) {
                      Text(
                          chantier.code,
                          color = Green,
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Text(
                          chantier.name,
                          fontSize = 18.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Text(
                          chantier.location,
                          color = Color.Gray
                      )

                      Spacer(Modifier.height(12.dp))

                      LinearProgressIndicator(
                          progress = { chantier.progress / 100f },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(8.dp)
                      )

                      Spacer(Modifier.height(8.dp))

                      Text(
                          "${chantier.progress}% d'avancement",
                          color = Green,
                          fontWeight = FontWeight.Bold
                      )
                  }
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUIVI-TRX-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
